<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Transfer - Transfert de fichiers sécurisé</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #0f0f23, #1a1a3d);
      color: #fff;
      text-align: center;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      max-width: 600px;
      padding: 40px;
      background: rgba(255,255,255,0.05);
      border-radius: 20px;
      backdrop-filter: blur(10px);
    }
    h1 {
      color: #00ff9f;
      margin-bottom: 10px;
    }
    input[type="file"] {
      margin: 20px 0;
      padding: 10px;
    }
    button {
      background: #00ff9f;
      color: #000;
      border: none;
      padding: 15px 30px;
      font-size: 18px;
      border-radius: 50px;
      cursor: pointer;
      margin: 20px;
    }
    button:hover {
      background: #00cc7a;
    }
    .link {
      margin-top: 30px;
      word-break: break-all;
      background: rgba(0,0,0,0.3);
      padding: 15px;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌌 Nexus Transfer</h1>
    <p>Transférez des fichiers jusqu'à plusieurs Go - Gratuit & Temporaire</p>
    
    <div id="app"></div>
  </div>

  <script type="module" src="/src/index.js"></script>
</body>
</html>
