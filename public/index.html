<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Transfer — Transfert de fichiers rapide et temporaire</title>
  <meta name="description" content="Envoyez vos fichiers en un lien, chiffrés et éphémères.">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%231ee6a4'/><path d='M12 6l5 6h-3v6h-4v-6H7z' fill='%2307070d'/></svg>">
  <link rel="stylesheet" href="/app.css">
</head>
<body>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1ee6a4"/><stop offset="1" stop-color="#12b6ff"/></linearGradient>
    </defs>
    <symbol id="i-logo" viewBox="0 0 24 24"><rect x="1.5" y="1.5" width="21" height="21" rx="6.5" fill="url(#g)"/><path d="M12 6l5.5 6.5h-3.4V18H9.9v-5.5H6.5z" fill="#07070d"/></symbol>
    <symbol id="i-cloud" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4 4 0 0 1-.5-7.97A5.5 5.5 0 0 1 17.5 9.5 3.75 3.75 0 0 1 17 18z"/><path d="M12 15V9m0 0l-2.3 2.3M12 9l2.3 2.3"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2.5"/><circle cx="9" cy="9.5" r="1.6"/><path d="M5 16l4-4 3.5 3.5L16 12l3 3.5"/></symbol>
    <symbol id="i-video" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="14" height="14" rx="2.5"/><path d="M17 10l4-2.5v9L17 14z"/></symbol>
    <symbol id="i-audio" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6l10-2v12"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/></symbol>
    <symbol id="i-pdf" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></symbol>
    <symbol id="i-archive" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2.5"/><path d="M12 4v3m0 2v2m0 2v2m0 2h.01"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0l-4-4m4 4l4-4"/><path d="M5 19h14"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7l10 10M17 7L7 17"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9.5 16.5H2.5z"/><path d="M12 9v5m0 3h.01"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l1.6 4.4L18 10l-4.4 1.6L12 16l-1.6-4.4L6 10l4.4-1.6z"/></symbol>
    <symbol id="i-download-cloud" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17a4 4 0 0 1-.5-7.97A5.5 5.5 0 0 1 17.5 8.5 3.75 3.75 0 0 1 17.4 16"/><path d="M12 12v7m0 0l-2.5-2.5M12 19l2.5-2.5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6v12M6 12h12"/></symbol>
  </svg>

  <main class="shell">
    <div class="brand"><svg class="logo"><use href="#i-logo"/></svg><h1>Nexus Transfer</h1></div>

    <div class="card">
      <p class="tagline">Envoyez vos fichiers en un lien — rapide, chiffré, éphémère.</p>

      <label class="drop" id="drop">
        <input type="file" id="fileInput" multiple>
        <svg class="ico"><use href="#i-cloud"/></svg>
        <div class="big">Glissez vos fichiers ici</div>
        <div class="small">ou cliquez pour parcourir — 5 Go au total</div>
      </label>

      <div id="fileList" class="file-list"></div>

      <div id="usage" class="usage hidden">
        <div class="head"><span class="used" id="usedLabel">0 o / 5 Go</span><span class="left" id="leftLabel">5 Go restants</span></div>
        <div class="bar"><div class="fill" id="usageFill" style="width:0%"></div></div>
      </div>

      <div class="options" id="options" style="display:none">
        <div class="field">
          <label>Expiration du lien</label>
          <div class="seg" id="expiry" role="group">
            <button type="button" data-days="1">1 jour</button>
            <button type="button" data-days="7" aria-pressed="true">7 jours</button>
            <button type="button" data-days="30">30 jours</button>
          </div>
        </div>
        <div class="field">
          <label>Téléchargements maximum</label>
          <div class="seg" id="maxdl" role="group">
            <button type="button" data-max="1">1</button>
            <button type="button" data-max="10" aria-pressed="true">10</button>
            <button type="button" data-max="50">50</button>
            <button type="button" data-max="1000">Illimité</button>
          </div>
        </div>
        <label class="toggle" id="compressToggle" style="display:none">
          <svg style="width:20px;height:20px;color:var(--accent)"><use href="#i-spark"/></svg>
          <span class="txt"><b>Optimiser les images</b><span>Compression haute qualité (WebP)</span></span>
          <span class="switch"><input type="checkbox" id="compress" checked><span class="track"></span></span>
        </label>
      </div>

      <button class="btn mt" id="sendBtn" disabled>
        <svg><use href="#i-download-cloud"/></svg><span id="sendLabel">Envoyer</span>
      </button>

      <div class="progress" id="progress">
        <div class="head"><span id="progressLabel">Préparation…</span><span class="pct" id="pct">0%</span></div>
        <div class="bar"><div class="fill" id="fill"></div></div>
        <div class="sub" id="progressSub"></div>
      </div>

      <div class="result" id="result">
        <div class="ok"><svg class="check-anim"><use href="#i-check"/></svg><span>Transfert prêt</span></div>
        <div class="link-box">
          <span class="url" id="resultUrl"></span>
          <button class="copy" id="copyBtn" type="button"><svg><use href="#i-copy"/></svg><span>Copier</span></button>
        </div>
        <button class="btn ghost mt" id="againBtn" type="button">Nouveau transfert</button>
      </div>

      <div id="error" class="alert err hidden"><svg><use href="#i-alert"/></svg><span id="errorMsg"></span></div>
    </div>

    <p class="foot">Les fichiers sont supprimés à l'expiration. <a href="/">nexus-transfer</a></p>
  </main>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { getStorage, ref, uploadBytesResumable } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js';
    import { getFunctions, httpsCallable } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-functions.js';
    import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

    const ready = (async () => {
      const config = await (await fetch('/__/firebase/init.json')).json();
      const app = initializeApp(config);
      return { storage: getStorage(app), functions: getFunctions(app, 'us-central1'), auth: getAuth(app) };
    })();

    const $ = (id) => document.getElementById(id);
    const MAX_TOTAL = 5 * 1024 * 1024 * 1024; // 5 Go
    const MAX_FILES = 20;
    const state = { files: [], days: 7, max: 10 };

    function humanSize(b) {
      if (!b && b !== 0) return '—';
      const u = ['o', 'Ko', 'Mo', 'Go', 'To']; let i = 0; let n = b;
      while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
      return `${n.toFixed(n < 10 && i > 0 ? 1 : 0)} ${u[i]}`;
    }
    function iconFor(type = '', name = '') {
      const t = type.toLowerCase(); const ext = (name.split('.').pop() || '').toLowerCase();
      if (t.startsWith('image/')) return 'i-image';
      if (t.startsWith('video/')) return 'i-video';
      if (t.startsWith('audio/')) return 'i-audio';
      if (t === 'application/pdf' || ext === 'pdf') return 'i-pdf';
      if (/zip|rar|7z|tar|gz|compressed/.test(t) || /^(zip|rar|7z|tar|gz)$/.test(ext)) return 'i-archive';
      return 'i-file';
    }
    const totalSize = () => state.files.reduce((s, f) => s + f.size, 0);

    async function optimizeImage(file, quality = 0.92) {
      if (!file.type.startsWith('image/') || /gif|svg/.test(file.type)) return { file, saved: 0 };
      try {
        const bitmap = await createImageBitmap(file);
        const maxDim = 4096;
        const scale = Math.min(1, maxDim / Math.max(bitmap.width, bitmap.height));
        const w = Math.round(bitmap.width * scale), h = Math.round(bitmap.height * scale);
        const canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(bitmap, 0, 0, w, h);
        const blob = await new Promise((res) => canvas.toBlob(res, 'image/webp', quality));
        if (blob && blob.size < file.size) {
          const name = file.name.replace(/\.[^.]+$/, '') + '.webp';
          return { file: new File([blob], name, { type: 'image/webp' }), saved: file.size - blob.size };
        }
      } catch (e) { console.warn('Compression ignorée', e); }
      return { file, saved: 0 };
    }

    // --- Ajout de fichiers (avec budget 5 Go) ---
    function addFiles(list) {
      hideError();
      let used = totalSize(); let skipped = 0;
      for (const file of list) {
        if (state.files.length >= MAX_FILES) { skipped++; continue; }
        if (state.files.some((f) => f.name === file.name && f.size === file.size)) continue;
        if (used + file.size > MAX_TOTAL) { skipped++; continue; }
        state.files.push(file); used += file.size;
      }
      if (skipped > 0) showError(`${skipped} fichier(s) ignoré(s) : limite de 5 Go ou de ${MAX_FILES} fichiers atteinte.`);
      render();
    }
    function removeFile(i) { state.files.splice(i, 1); render(); }

    function render() {
      const list = $('fileList'); list.innerHTML = '';
      state.files.forEach((file, i) => {
        const row = document.createElement('div'); row.className = 'file-row';
        const isImg = file.type.startsWith('image/') && !/gif|svg/.test(file.type);
        const thumb = isImg ? `<img alt="" src="${URL.createObjectURL(file)}">` : `<svg><use href="#${iconFor(file.type, file.name)}"/></svg>`;
        row.innerHTML = `<div class="thumb">${thumb}</div>
          <div class="meta"><div class="name">${file.name}</div><div class="sub">${humanSize(file.size)}</div></div>
          <button class="clear" type="button" aria-label="Retirer"><svg><use href="#i-x"/></svg></button>`;
        row.querySelector('.clear').addEventListener('click', (e) => { e.preventDefault(); removeFile(i); });
        list.appendChild(row);
      });

      const has = state.files.length > 0;
      const used = totalSize(); const left = Math.max(0, MAX_TOTAL - used); const pct = Math.min(100, used / MAX_TOTAL * 100);
      $('usage').classList.toggle('hidden', !has);
      $('usedLabel').textContent = `${humanSize(used)} / 5 Go · ${state.files.length} fichier${state.files.length > 1 ? 's' : ''}`;
      $('leftLabel').textContent = `${humanSize(left)} restants`;
      $('leftLabel').classList.toggle('full', pct > 99);
      $('usageFill').style.width = pct + '%';
      $('usageFill').classList.toggle('full', pct > 99);

      $('options').style.display = has ? 'grid' : 'none';
      $('drop').style.display = state.files.length >= MAX_FILES ? 'none' : 'block';
      const anyImg = state.files.some((f) => f.type.startsWith('image/') && !/gif|svg/.test(f.type));
      $('compressToggle').style.display = anyImg ? 'flex' : 'none';
      $('sendBtn').disabled = !has;
      $('sendLabel').textContent = has ? `Envoyer ${state.files.length} fichier${state.files.length > 1 ? 's' : ''}` : 'Envoyer';
    }

    $('fileInput').addEventListener('change', (e) => { addFiles(e.target.files); e.target.value = ''; });

    const drop = $('drop');
    ['dragenter', 'dragover'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add('drag'); }));
    ['dragleave', 'drop'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove('drag'); }));
    drop.addEventListener('drop', (e) => { if (e.dataTransfer.files.length) addFiles(e.dataTransfer.files); });

    function wireSeg(id, key) {
      $(id).addEventListener('click', (e) => {
        const btn = e.target.closest('button'); if (!btn) return;
        [...e.currentTarget.children].forEach((b) => b.setAttribute('aria-pressed', b === btn));
        state[key] = Number(btn.dataset[key === 'days' ? 'days' : 'max']);
      });
    }
    wireSeg('expiry', 'days'); wireSeg('maxdl', 'max');

    $('sendBtn').addEventListener('click', upload);
    async function upload() {
      if (!state.files.length) return;
      hideError(); $('sendBtn').disabled = true; $('progress').classList.add('show');
      setProgress(0, 'Préparation…', '');
      try {
        const { storage, functions, auth } = await ready;
        if (!auth.currentUser) await signInAnonymously(auth);

        let files = state.files.slice();
        if ($('compressToggle').style.display !== 'none' && $('compress').checked) {
          setProgress(0, 'Optimisation…', '');
          let saved = 0;
          files = await Promise.all(files.map(async (f) => { const r = await optimizeImage(f); saved += r.saved; return r.file; }));
          if (saved > 0) $('progressSub').textContent = `Images optimisées · ${humanSize(saved)} économisés`;
        }

        const createTransfer = httpsCallable(functions, 'createTransfer');
        const { data } = await createTransfer({
          files: files.map((f) => ({ fileName: f.name, size: f.size, contentType: f.type })),
          expiresDays: state.days, maxDownloads: state.max,
        });

        const loaded = new Array(files.length).fill(0);
        const grand = files.reduce((s, f) => s + f.size, 0) || 1;
        const started = Date.now();
        await Promise.all(files.map((file, i) => new Promise((resolve, reject) => {
          const task = uploadBytesResumable(ref(storage, data.files[i].storagePath), file);
          task.on('state_changed', (snap) => {
            loaded[i] = snap.bytesTransferred;
            const sum = loaded.reduce((a, b) => a + b, 0);
            const secs = (Date.now() - started) / 1000; const speed = secs > 0 ? sum / secs : 0;
            const remain = speed > 0 ? (grand - sum) / speed : 0;
            setProgress(Math.round(sum / grand * 100), `Envoi · ${files.length} fichier${files.length > 1 ? 's' : ''}`,
              `${humanSize(sum)} / ${humanSize(grand)} · ${humanSize(speed)}/s` + (remain > 1 ? ` · ${Math.ceil(remain)} s restantes` : ''));
          }, reject, resolve);
        })));

        setProgress(100, 'Terminé', '');
        $('resultUrl').textContent = data.link; $('copyBtn').dataset.link = data.link;
        setTimeout(() => { $('progress').classList.remove('show'); $('result').classList.add('show'); }, 350);
      } catch (err) {
        console.error(err); showError('Erreur : ' + (err.message || err));
        $('progress').classList.remove('show'); $('sendBtn').disabled = false;
      }
    }

    function setProgress(pct, label, sub) {
      $('fill').style.width = pct + '%'; $('pct').textContent = pct + '%';
      $('progressLabel').textContent = label; if (sub !== undefined) $('progressSub').textContent = sub;
    }
    function showError(msg) { $('errorMsg').textContent = msg; $('error').classList.remove('hidden'); }
    function hideError() { $('error').classList.add('hidden'); }

    $('copyBtn').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText($('copyBtn').dataset.link);
        const b = $('copyBtn'); b.classList.add('done');
        b.querySelector('span').textContent = 'Copié'; b.querySelector('use').setAttribute('href', '#i-check');
        setTimeout(() => { b.classList.remove('done'); b.querySelector('span').textContent = 'Copier'; b.querySelector('use').setAttribute('href', '#i-copy'); }, 1800);
      } catch (e) { console.warn(e); }
    });
    $('againBtn').addEventListener('click', () => { $('result').classList.remove('show'); state.files = []; render(); });
  </script>
</body>
</html>
